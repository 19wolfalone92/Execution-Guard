name: Bootstrap reproducible npm lockfile
on:
  push:
    branches:
      - audit/oauth-e2e-20261125
permissions:
  contents: write
concurrency:
  group: lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate lockfile without running package scripts
        id: generate
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Commit only package-lock.json to the qualification branch
        if: steps.generate.outputs.created == 'true'
        run: |
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: commit reproducible npm lockfile"
          git push origin HEAD:refs/heads/audit/oauth-e2e-20261125
