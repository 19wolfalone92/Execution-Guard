name: Exact Preview HTTP and isolation qualification
on:
  push:
    branches: [audit/oauth-e2e-20261125]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read
concurrency:
  group: eg-exact-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == '19wolfalone92/Execution-Guard' && github.ref == 'refs/heads/audit/oauth-e2e-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: node --check qualification/preview-smoke.mjs
      - run: node qualification/preview-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MANAGEMENT_TOKEN: ${{ secrets.CLOUDFLARE_MANAGEMENT_TOKEN }}
          EG_PREVIEW_TICK_SECRET: ${{ secrets.EG_PREVIEW_TICK_SECRET }}
          EG_PREVIEW_GITHUB_READ_TOKEN: ${{ secrets.EG_PREVIEW_GITHUB_READ_TOKEN }}
