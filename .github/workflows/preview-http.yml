name: Exact Preview HTTP and isolation qualification
on:
  push:
    branches: [audit/oauth-e2e-20261125]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node qualification/preview-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
