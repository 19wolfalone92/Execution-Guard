name: Preview OAuth and backup preflight
on:
  push:
    branches: [audit/oauth-e2e-20261125]
    paths: ['qualification/release-preflight.mjs', '.github/workflows/release-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == '19wolfalone92/Execution-Guard' && github.ref == 'refs/heads/audit/oauth-e2e-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node --check qualification/release-preflight.mjs
      - run: node qualification/release-preflight.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MANAGEMENT_TOKEN: ${{ secrets.CLOUDFLARE_MANAGEMENT_TOKEN }}
          EG_PREVIEW_TICK_SECRET: ${{ secrets.EG_PREVIEW_TICK_SECRET }}
