name: Production backup and isolated restore qualification
on:
  workflow_dispatch:
  push:
    branches: [audit/oauth-e2e-20261125]
    paths: ['qualification/production-backup.mjs', '.github/workflows/production-backup.yml']
permissions:
  contents: read
concurrency:
  group: execution-guard-production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == '19wolfalone92/Execution-Guard' && github.ref == 'refs/heads/audit/oauth-e2e-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: node --check qualification/production-backup.mjs
      - run: node qualification/production-backup.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MANAGEMENT_TOKEN: ${{ secrets.CLOUDFLARE_MANAGEMENT_TOKEN }}
          CLOUDFLARE_D1_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
