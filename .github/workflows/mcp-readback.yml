name: Read persisted MCP diagnostics
on:
  push:
    branches: [audit/oauth-e2e-20261125]
    paths: ['qualification/mcp-readback.mjs', '.github/workflows/mcp-readback.yml']
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == '19wolfalone92/Execution-Guard' && github.ref == 'refs/heads/audit/oauth-e2e-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node qualification/mcp-readback.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
