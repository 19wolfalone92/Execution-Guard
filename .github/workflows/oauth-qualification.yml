name: OAuth and MCP runtime qualification
on:
  push:
    branches:
      - audit/oauth-e2e-20261125
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production and runtime testing dependencies
        run: npm install --no-save --package-lock=false wrangler@4 miniflare@4
      - name: Bundle exactly as a Workers deployment (no deploy)
        run: npx wrangler deploy --dry-run --outdir .oauth-build
      - name: Exercise full OAuth and protected MCP flow using workerd
        run: node qualification/oauth-runtime.mjs
